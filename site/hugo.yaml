baseURL: "/"
title: ObraFlow · Aprovações
locale: pt
defaultContentLanguage: pt
theme: hextra

enableRobotsTXT: true
enableInlineShortcodes: true
enableEmoji: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML, RSS]

languages:
  pt:
    label: Português
    weight: 1
    title: ObraFlow · Aprovações

menu:
  main:
    - name: Documentação
      pageRef: /docs
      weight: 1
    - name: Tutoriais
      pageRef: /tutoriais
      weight: 2
    - name: Busca
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/Carolbalbs/obraflow-case"
      params:
        icon: github

  sidebar:
    - identifier: more
      name: Mais
      params:
        type: separator
      weight: 1
    - identifier: readme
      name: README do desafio
      url: "https://github.com/Carolbalbs/obraflow-case/blob/resolucao-obraflow/docs/README.md"
      weight: 2
    - identifier: contato
      name: Falar com o recrutador
      url: "https://wa.me/5571992044335"
      weight: 3

params:
  description: Escopo de documentação do desafio ObraFlow — o serviço de alçadas de aprovação.

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true
    width: normal

  theme:
    default: system
    displayToggle: true

  displayUpdatedDate: false

  editURL:
    enable: false

  page:
    width: normal

  toc:
    displayTags: true
