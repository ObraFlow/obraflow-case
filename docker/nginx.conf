map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Count only POSTs to the exact login location below. Empty keys are not limited.
map $request_method $login_limit_key {
    default '';
    POST $binary_remote_addr;
}
limit_req_zone $login_limit_key zone=login_per_ip:10m rate=30r/m;

server {
    listen 8080;
    server_name _;
    root ${WEB_ROOT};
    index index.html;
    # Rendered at startup: envsubst replaces only NGINX_TRUSTED_PROXY, API_UPSTREAM and WEB_ROOT.
    # Trust only the actual ingress proxy IP/CIDR; the loopback default ignores forwarded headers
    # from direct external clients.
    set_real_ip_from ${NGINX_TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Match Fastify's 1 MiB limit and preserve its JSON error contract at the proxy.
    client_max_body_size 1m;
    error_page 413 = @payload_too_large;
    proxy_next_upstream off;
    # Re-resolve the API after container replacement without restarting nginx. The Docker DNS
    # resolver is unused when API_UPSTREAM is an IP address, as on a host without Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api ${API_UPSTREAM};

    location = /api/v1/auth/login {
        # One initial request plus twenty excess requests may run immediately.
        # Capacity recovers at one request every two seconds, per client IP.
        limit_req zone=login_per_ip burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @login_rate_limited;
        proxy_pass $api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @login_rate_limited {
        default_type application/json;
        charset utf-8;
        add_header Retry-After 2 always;
        add_header Cache-Control no-store always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Muitas tentativas de login. Aguarde alguns segundos e tente novamente.","details":[]}}';
    }

    location /api/ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Realtime hints (Socket.IO over WebSocket). The API rejects browser Origins that differ
    # from Host, so forward the original Host header including any port.
    location /socket.io/ {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location = /healthz {
        proxy_pass $api/healthz;
    }
    location @payload_too_large {
        default_type application/json;
        charset utf-8;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"O corpo da requisição excede o limite permitido.","details":[]}}';
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
