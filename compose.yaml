services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: obraflow
      POSTGRES_USER: obraflow
      POSTGRES_PASSWORD: obraflow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-6000}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obraflow -d obraflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
