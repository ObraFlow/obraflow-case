services:
  db:
    image: postgres:16-alpine
    container_name: obraflow-db
    environment:
      POSTGRES_USER: obraflow
      POSTGRES_PASSWORD: obraflow
      POSTGRES_DB: obraflow
    ports:
      - "5432:5432"
    volumes:
      - obraflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obraflow -d obraflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  obraflow-pgdata:
