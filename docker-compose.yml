services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obraflow}
      POSTGRES_USER: ${POSTGRES_USER:-obraflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obraflow_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - obraflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-obraflow} -d ${POSTGRES_DB:-obraflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-obraflow}
      DB_USERNAME: ${POSTGRES_USER:-obraflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-obraflow_dev}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  obraflow-postgres-data:
