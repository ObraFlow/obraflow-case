# docker compose up --build  ->  app at http://localhost:8080
# Only the database is needed for local development (pnpm dev); `docker compose up db`.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: obraflow
      POSTGRES_PASSWORD: obraflow
      POSTGRES_DB: obraflow
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obraflow -d obraflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://obraflow:obraflow@db:5432/obraflow?schema=public
      COOKIE_SECRET: docker-local-secret-change-me
      # NODE_ENV is left unset on purpose: "production" marks the session cookie
      # Secure, which needs HTTPS outside localhost.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
