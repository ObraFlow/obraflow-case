<header style="background: #ffffff; border-bottom: 1px solid var(--slate-200); position: sticky; top: 0; z-index: 100;">
  <div class="container" style="display: flex; justify-content: space-between; align-items: center; height: 3.5rem;">
    <!-- Brand -->
    <div style="display: flex; align-items: center; gap: 2rem;">
      <a routerLink="/" style="text-decoration: none; font-size: 1.15rem; font-weight: 700; color: var(--slate-900); letter-spacing: -0.02em;">
        ObraFlow
      </a>

      <!-- Navigation -->
      <nav style="display: flex; gap: 0.25rem;">
        <a
          routerLink="/pedidos"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
        >
          Pedidos
        </a>
        <a
          routerLink="/pedidos/novo"
          routerLinkActive="active"
          class="nav-link"
        >
          Novo Pedido
        </a>
        <a
          routerLink="/regras"
          routerLinkActive="active"
          class="nav-link"
        >
          Regras de Alçada
        </a>
      </nav>
    </div>

    <!-- User Selector -->
    <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem;">
      <span style="color: var(--slate-500); font-weight: 500;">Usuário:</span>
      <select
        style="padding: 0.25rem 0.5rem; font-size: 0.8rem; border: 1px solid var(--slate-300); border-radius: 0.25rem; background: #ffffff; color: var(--slate-800); cursor: pointer;"
        [(ngModel)]="usuarioSelecionadoId"
        (change)="selecionarUsuario(usuarioSelecionadoId)"
      >
        <option *ngFor="let u of usuarios" [value]="u.id">
          {{ u.nome }} ({{ u.cargo }})
        </option>
      </select>
    </div>
  </div>
</header>

<main style="min-height: calc(100vh - 7rem);">
  <router-outlet></router-outlet>
</main>

<footer style="background: #ffffff; border-top: 1px solid var(--slate-200); padding: 1rem 0; font-size: 0.78rem; color: var(--slate-500);">
  <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
    <div>ObraFlow</div>
    <div>Serviço de Gestão e Alçadas de Aprovação</div>
  </div>
</footer>
