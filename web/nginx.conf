# Same role as the Vite proxy in development: the browser only talks to this
# server, so the API session cookie is same-origin (no CORS needed).
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed assets never change: cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (/pedidos/123) all serve the app shell.
  location / {
    try_files $uri /index.html;
  }
}
