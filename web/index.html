<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1f22" />
    <meta name="description" content="Pedidos de compra com alçada de aprovação por obra. Desafio técnico ObraFlow, por Leonardo Pires." />
    <script>
      // aplica o tema salvo antes do primeiro paint (evita piscar claro no tema escuro)
      try {
        var t = localStorage.getItem('obraflow.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ObraFlow · Pedidos e alçadas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
