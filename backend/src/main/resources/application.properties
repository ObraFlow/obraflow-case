spring.application.name=obraflow-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/obraflow}
spring.datasource.username=${DB_USERNAME:obraflow}
spring.datasource.password=${DB_PASSWORD:obraflow_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.cors.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
