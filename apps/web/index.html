<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dokimos | Pedidos e aprovações</title>
    <meta name="description" content="Dokimos by ObraFlow. Gestão de pedidos e aprovações por alçada." />
    <meta name="application-name" content="Dokimos" />
    <meta name="apple-mobile-web-app-title" content="Dokimos" />
    <meta name="theme-color" content="#252A30" />
    <link rel="icon" href="/brand/dokimos-favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/dokimos-icon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/dokimos-icon-180.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      try {
        const mode = localStorage.getItem("obraflow.theme");
        document.documentElement.classList.toggle("dark", mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches));
      } catch { document.documentElement.classList.toggle("dark", matchMedia("(prefers-color-scheme: dark)").matches); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
